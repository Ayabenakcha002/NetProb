[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "0.1.0"
description = "Multithreaded TCP port scanner with banner grabbing and JSON/CSV/HTML reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aya Benakcha" }]
keywords = ["security", "networking", "port-scanner", "cybersecurity", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Intended Audience :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netprobe = "netprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
